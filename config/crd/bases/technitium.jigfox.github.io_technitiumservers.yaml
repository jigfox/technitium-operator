---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: technitiumservers.technitium.jigfox.github.io
spec:
  group: technitium.jigfox.github.io
  names:
    kind: TechnitiumServer
    listKind: TechnitiumServerList
    plural: technitiumservers
    singular: technitiumserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TechnitiumServer is one Technitium DNS Server node the operator
          manages.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TechnitiumServerSpec defines the desired state of TechnitiumServer.
            properties:
              apps:
                description: |-
                  apps are the configurations of installed DNS apps to manage. App
                  configurations are not synced between the nodes of a Technitium
                  cluster, so list them on the TechnitiumServer of every node.
                items:
                  description: AppConfig is the partial configuration of an installed
                    DNS app.
                  properties:
                    config:
                      description: |-
                        config holds the keys to set in the app's configuration. They are merged
                        (top-level keys) over the live configuration; keys that are not listed
                        keep their value.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: name of the installed app, e.g. "Query Logs (Sqlite)".
                      minLength: 1
                      type: string
                  required:
                  - config
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              credentialsSecretRef:
                description: credentialsSecretRef selects the login.
                properties:
                  name:
                    description: name of the Secret.
                    minLength: 1
                    type: string
                  passwordKey:
                    default: password
                    description: passwordKey is the key in the Secret that holds the
                      password.
                    type: string
                  tokenKey:
                    description: |-
                      tokenKey is the key in the Secret that holds an API token. If set, the
                      token is used and username and password are ignored.
                    type: string
                  username:
                    description: |-
                      username is the account name as a literal. If set, usernameKey is not
                      used.
                    type: string
                  usernameKey:
                    default: username
                    description: usernameKey is the key in the Secret that holds the
                      account name.
                    type: string
                required:
                - name
                type: object
              pruneUnmanaged:
                description: |-
                  pruneUnmanaged deletes entries that no domain resource covers. Off by
                  default.
                properties:
                  allowedDomains:
                    description: allowedDomains prunes the allowed zones.
                    type: boolean
                  blockedDomains:
                    description: |-
                      blockedDomains prunes the blocked zones (the manually added ones, not
                      the domains of the block lists).
                    type: boolean
                type: object
              settings:
                description: 'settings to manage. Not set: the settings are not touched.'
                properties:
                  blockListUrls:
                    description: |-
                      blockListUrls are the block list URLs Technitium downloads. They replace
                      the live list; an empty list clears it. Technitium re-downloads the
                      lists whenever they change, so the operator writes only on a difference.
                    items:
                      type: string
                    type: array
                type: object
              url:
                description: |-
                  url is the base URL of the Technitium web service, for example
                  http://technitium-0.dns.svc:5380.
                pattern: ^https?://[^\s/]+(/\S*)?$
                type: string
            required:
            - credentialsSecretRef
            - url
            type: object
          status:
            description: TechnitiumServerStatus defines the observed state of TechnitiumServer.
            properties:
              conditions:
                description: 'conditions: Ready, and DryRun while the operator runs
                  with --dry-run.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation the conditions were
                  computed for.
                format: int64
                type: integer
              version:
                description: version of the Technitium DNS Server.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
