# This rule is not used by the project technitium-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over technitium.jigfox.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: technitium-operator
    app.kubernetes.io/managed-by: kustomize
  name: technitiumserver-admin-role
rules:
- apiGroups:
  - technitium.jigfox.github.io
  resources:
  - technitiumservers
  verbs:
  - '*'
- apiGroups:
  - technitium.jigfox.github.io
  resources:
  - technitiumservers/status
  verbs:
  - get
