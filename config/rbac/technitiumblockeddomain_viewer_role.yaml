# This rule is not used by the project technitium-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to technitium.jigfox.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: technitium-operator
    app.kubernetes.io/managed-by: kustomize
  name: technitiumblockeddomain-viewer-role
rules:
- apiGroups:
  - technitium.jigfox.github.io
  resources:
  - technitiumblockeddomains
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - technitium.jigfox.github.io
  resources:
  - technitiumblockeddomains/status
  verbs:
  - get
