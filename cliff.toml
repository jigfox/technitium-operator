# git-cliff configuration: release notes and next-version computation.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jigfox/technitium-operator/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
# pre-releases are never a base for the next version
skip_tags = "v[0-9]+\\.[0-9]+\\.[0-9]+-.*"

# Only releasable types make it in. The rest is skipped, so a push that
# contains nothing else yields no version bump and no release notes.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = ".*", skip = true },
]

[bump]
# 0.x: breaking changes bump minor, features bump minor, fixes patch
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
