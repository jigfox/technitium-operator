name: Pre-release

# A same-repo PR with the label "prerelease" gets a pre-release build:
# <next version>-pr.<PR number>.<run number>. Closing the PR deletes its
# pre-releases and their tags (the images stay). Fork PRs never get one.

on:
  pull_request:
    types: [labeled, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Pre-release version
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'prerelease')
      && (github.event.action != 'labeled' || github.event.label.name == 'prerelease')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    env:
      PR: ${{ github.event.pull_request.number }}
      RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # the merge ref: what main would release with this PR's commits
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - id: next
        run: |
          next=$(mise run -q release:next -- --or-patch)
          echo "version=$next-pr.$PR.$RUN" >> "$GITHUB_OUTPUT"

  build:
    name: Pre-release
    needs: version
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: true
      sha: ${{ github.event.pull_request.head.sha }}

  cleanup:
    name: Delete pre-releases
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E -- "-pr\.${PR}\.[0-9]+$" \
            | while read -r tag; do
                gh release delete "$tag" --cleanup-tag --yes
              done || true
